spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: "jdbc:h2:mem:branodb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH"
    driver-class-name: "org.h2.Driver"
    username: "sa"
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
springdoc:
  info:
    title: brano API (local)
logging:
  level:
    kr.pe.ryudaewan: DEBUG
